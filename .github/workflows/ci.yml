name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/MindCare.Web/package-lock.json

      - name: Restaurar ferramentas e pacotes
        run: |
          dotnet tool restore
          dotnet restore MindCare.slnx

      - name: Build
        run: dotnet build MindCare.slnx --configuration Release --no-restore

      - name: Testes
        run: dotnet test --solution MindCare.slnx --configuration Release --no-build

      - name: Verificar migrations pendentes
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/MindCare.Application
          --startup-project src/MindCare.Application
          --configuration Release
          --no-build

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mindcare-central-clinic:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
